          - heading "Streak with a Free Weekly Skip" [level=3] [ref=f1e92]
          - paragraph [ref=f1e93]: Life happens and missing a day shouldn't reset weeks of dedication. One free skip per ISO week preserves your streak automatically when rest is needed.
        - article [ref=f1e94]:
          - heading "4:00 AM Day Rollover" [level=3] [ref=f1e99]
          - paragraph [ref=f1e100]: Your calendar doesn't abruptly reset at midnight. All wins count until 4:00 AM local time, accommodating night owls and evening routines.
        - article [ref=f1e101]:
          - heading "Flexible Habit Cadences" [level=3] [ref=f1e105]
          - paragraph [ref=f1e106]: Schedule habits for every day, weekdays only, or N days per week. Habit-specific streaks keep track of your consistency over time.
        - article [ref=f1e107]:
          - heading "Guardrailed AI Coach" [level=3] [ref=f1e111]
          - paragraph [ref=f1e112]: The coach only proposes wins for you to accept or edit—it never writes to your data directly. Enforces a strict monthly budget cap with instant rule-based fallback.
        - article [ref=f1e113]:
          - heading "Passkey + Magic-Link Sign-in" [level=3] [ref=f1e117]
          - paragraph [ref=f1e118]: Passwordless biometric sign-in via WebAuthn (Touch ID, Face ID, security keys) or a fast email magic link fallback with 15-minute expiration.
        - article [ref=f1e119]:
          - heading "Installable Progressive Web App" [level=3] [ref=f1e123]
          - paragraph [ref=f1e124]: Service-worker powered PWA that installs on your phone or desktop home screen. Loads instantly with offline resilience and zero bundle bloat.
