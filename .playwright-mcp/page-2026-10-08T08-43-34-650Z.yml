            - paragraph [ref=f3e98]: Your calendar doesn't abruptly reset at midnight. All wins count until 4:00 AM local time, accommodating night owls and evening routines.
          - article [ref=f3e99]:
            - heading "Flexible Habit Cadences" [level=3] [ref=f3e103]
            - paragraph [ref=f3e104]: Schedule habits for every day, weekdays only, or N days per week. Habit-specific streaks keep track of your consistency over time.
