            - heading "Streak with a Free Weekly Skip" [level=3] [ref=f6e90]
            - paragraph [ref=f6e91]: Life happens and missing a day shouldn't reset weeks of dedication. One free skip per ISO week preserves your streak automatically when rest is needed.
          - article [ref=f6e92]:
            - heading "4:00 AM Day Rollover" [level=3] [ref=f6e97]
            - paragraph [ref=f6e98]: Your calendar doesn't abruptly reset at midnight. All wins count until 4:00 AM local time, accommodating night owls and evening routines.
          - article [ref=f6e99]:
            - heading "Flexible Habit Cadences" [level=3] [ref=f6e103]
            - paragraph [ref=f6e104]: Schedule habits for every day, weekdays only, or N days per week. Habit-specific streaks keep track of your consistency over time.
          - article [ref=f6e105]:
            - heading "Guardrailed AI Coach" [level=3] [ref=f6e109]
            - paragraph [ref=f6e110]: The coach only proposes wins for you to accept or edit—it never writes to your data directly. Enforces a strict monthly budget cap with instant rule-based fallback.
