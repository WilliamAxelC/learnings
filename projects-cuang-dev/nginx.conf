user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    server {
        listen       80;
        listen  [::]:80;
        server_name  projects.cuang.dev localhost _;
        absolute_redirect off;

        # Root landing portal
        location / {
            root   /usr/share/nginx/html/root;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # AI-nimate Exact Route Redirect
        location = /projects/ainimate {
            return 301 /projects/ainimate/;
        }

        # AI-nimate Static Video Hosting & Embed Players
        location /projects/ainimate/ {
            alias  /usr/share/nginx/html/projects/ainimate/;
            index  index.html;
            try_files $uri $uri/ /projects/ainimate/index.html =404;

            sendfile        on;
            tcp_nopush      on;
            tcp_nodelay     on;
            add_header      Access-Control-Allow-Origin * always;
            add_header      Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header      Access-Control-Allow-Headers "*" always;
            add_header      Accept-Ranges bytes always;
            add_header      Cache-Control "public, max-age=86400" always;
        }

        # AI-nimate Audio Gate Upload API (proxied to Cuangbot daemon)
        location /projects/ainimate/api/ {
            proxy_pass http://cuangbot:8989/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 100M;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Wyckoff Quant Backtester Exact Route Redirect
        location = /projects/backtester {
            return 301 /projects/backtester/;
        }
        location = /projects/backtest {
            return 301 /projects/backtester/;
        }
        location /projects/backtest/ {
            return 301 /projects/backtester/;
        }

        # Wyckoff Quant Backtester Reverse Proxy
        location /projects/backtester/ {
            proxy_pass http://host.docker.internal:8097/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # AudioDiff Redirect /AudioDiff -> /AudioDiff/
        location = /AudioDiff {
            return 301 /AudioDiff/;
        }

        # AudioDiff WebSocket Reverse Proxy
        location /AudioDiff/ws {
            proxy_pass http://10.20.20.178:3001/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # AudioDiff REST API Reverse Proxy
        location /AudioDiff/api/ {
            proxy_pass http://10.20.20.178:3001/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Direct /api/ and /ws fallback support
        location /api/ {
            proxy_pass http://10.20.20.178:3001/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
            proxy_pass http://10.20.20.178:3001/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # AudioDiff Website Static Assets
        location /AudioDiff/ {
            alias  /usr/share/nginx/html/AudioDiff/;
            index  index.html;
            try_files $uri $uri/ /AudioDiff/index.html;
        }

        # IDXClaw Redirects
        location = /IDXClaw {
            return 301 /IDXClaw/;
        }
        location = /idxclaw {
            return 301 /IDXClaw/;
        }
        location /idxclaw/ {
            return 301 /IDXClaw/;
        }

        # IDXClaw Website Static Assets
        location /IDXClaw/ {
            alias  /usr/share/nginx/html/IDXClaw/;
            index  index.html;
            try_files $uri $uri/ /IDXClaw/index.html;
        }

        # Custom Error Pages
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
