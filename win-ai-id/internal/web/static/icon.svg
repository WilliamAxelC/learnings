<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Luminous Sky Blue Squircle Container Gradient -->
    <linearGradient id="skyBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Crisp Soft Ice Border -->
    <linearGradient id="skyBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Ascending W Ribbon (Pure Clean White with Crisp Shadow) -->
    <linearGradient id="ribbonWhiteGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Spring Seedling & Tree Foliage Gradient -->
    <linearGradient id="springLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>

    <!-- Spring Sun Gold Apex Star Gradient -->
    <linearGradient id="springSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Ambient Sky Glow -->
    <radialGradient id="skyGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Elevation Shadow -->
    <filter id="softElevation" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#082f49" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#skyBgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#skyBorderGrad)" stroke-width="4"/>
  <circle cx="256" cy="220" r="190" fill="url(#skyGlow)"/>

  <!-- Subtle Precision Geometric Grid Marks -->
  <circle cx="96" cy="96" r="3" fill="#bae6fd" opacity="0.6"/>
  <circle cx="416" cy="96" r="3" fill="#bae6fd" opacity="0.6"/>
  <circle cx="96" cy="416" r="3" fill="#bae6fd" opacity="0.6"/>
  <circle cx="416" cy="416" r="3" fill="#bae6fd" opacity="0.6"/>

  <!-- Main Emblem: Spring Sprout / Tree Apex + Ascending 'W' Ribbon -->
  <g filter="url(#softElevation)">
    <!-- Apex: Spring Sprouting Seedling & Golden Momentum Ray -->
    <g transform="translate(256, 122)">
      <!-- Golden Apex Momentum Star -->
      <path d="M 0 -28 Q 0 0 28 0 Q 0 0 0 28 Q 0 0 -28 0 Q 0 0 0 -28 Z" fill="url(#springSunGrad)"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>

      <!-- Twin Spring Sprouting Leaves -->
      <!-- Left Leaf -->
      <path d="M -4 4 C -18 2 -32 14 -30 32 C -18 32 -6 22 -4 4 Z" fill="url(#springLeafGrad)"/>
      <!-- Right Leaf -->
      <path d="M 4 4 C 18 2 32 14 30 32 C 18 32 6 22 4 4 Z" fill="url(#springLeafGrad)"/>
      <!-- Tiny stem connecting down -->
      <path d="M 0 4 L 0 34" stroke="#86efac" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- The Ascending 'W' Monogram Ribbon in Crisp White -->
    <path d="M 126 234 L 190 380 C 196 394 214 394 220 380 L 256 248 L 292 380 C 298 394 316 394 322 380 L 386 234"
          fill="none"
          stroke="url(#ribbonWhiteGrad)"
          stroke-width="44"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
