# Runs on docker-host. Traffic can arrive via Cloudflare Tunnel or host port 8096.
services:
  win:
    build: .
    container_name: win-ai-id
    restart: unless-stopped
    env_file: .env
    ports:
      - "8096:8080"
    volumes:
      - win-data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: win-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [win]
    profiles:
      - tunnel

  litestream:
    image: litestream/litestream:0.3
    container_name: win-litestream
    restart: unless-stopped
    command: replicate
    env_file: .env
    volumes:
      - win-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    profiles:
      - backup

volumes:
  win-data:
