user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    server {
        listen       80;
        listen  [::]:80;
        server_name  projects.cuang.dev localhost _;
        absolute_redirect off;

        # Root landing portal
        location / {
            root   /usr/share/nginx/html/root;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # AI-nimate Exact Route Redirect
        location = /projects/ainimate {
            return 301 /projects/ainimate/;
        }

        # AI-nimate Static Video Hosting & Embed Players
        location ^~ /projects/ainimate/ {
            auth_basic "AI-nimate Admin";
            auth_basic_user_file /etc/nginx/.htpasswd;

            # Legacy channel root redirect
            rewrite ^/projects/ainimate/kausalmedia/?$ /projects/ainimate/ permanent;

            # 1. Anatomi Saham Gorengan di BEI (20261015)
            rewrite ^/projects/ainimate/(?:kausalmedia/)?anatomi-saham-gorengan-di-bei(?:-re)?(?:/(.*))?$ /projects/ainimate/kausalmedia_20261015_anatomi-saham-gorengan-di-bei/$1 permanent;
            rewrite ^/projects/ainimate/vid_20261015_001(?:/(.*))?$ /projects/ainimate/kausalmedia_20261015_anatomi-saham-gorengan-di-bei/$1 permanent;
            rewrite ^/projects/ainimate/kausalmedia_20261021_anatomi-saham-gorengan-di-bei(?:/(.*))?$ /projects/ainimate/kausalmedia_20261015_anatomi-saham-gorengan-di-bei/$1 permanent;

            # 2. Humane AI Pin Hardware Collapse (20261021)
            rewrite ^/projects/ainimate/(?:kausalmedia/)?humane-ai-pin-hardware-collapse(?:/(.*))?$ /projects/ainimate/kausalmedia_20261021_humane-ai-pin-hardware-collapse/$1 permanent;
            rewrite ^/projects/ainimate/vid_20261021_001(?:/(.*))?$ /projects/ainimate/kausalmedia_20261021_humane-ai-pin-hardware-collapse/$1 permanent;

            # 3. Offshore Investing Tax Traps (20261024)
            rewrite ^/projects/ainimate/(?:kausalmedia/)?offshore-investing-tax-traps-indonesia(?:/(.*))?$ /projects/ainimate/kausalmedia_20261024_offshore-investing-tax-traps-indonesia/$1 permanent;
            rewrite ^/projects/ainimate/vid_20261024_001(?:/(.*))?$ /projects/ainimate/kausalmedia_20261024_offshore-investing-tax-traps-indonesia/$1 permanent;
            rewrite ^/projects/ainimate/kausalmedia_20261029_offshore-investing-tax-traps-indonesia(?:/(.*))?$ /projects/ainimate/kausalmedia_20261024_offshore-investing-tax-traps-indonesia/$1 permanent;

            # 4. The AI Bubble Explained (20261029)
            rewrite ^/projects/ainimate/(?:kausalmedia/)?the-ai-bubble-explained(?:/(.*))?$ /projects/ainimate/kausalmedia_20261029_the-ai-bubble-explained/$1 permanent;
            rewrite ^/projects/ainimate/vid_20261029_002(?:/(.*))?$ /projects/ainimate/kausalmedia_20261029_the-ai-bubble-explained/$1 permanent;
            rewrite ^/projects/ainimate/kausalmedia_20261024_the-ai-bubble-explained(?:/(.*))?$ /projects/ainimate/kausalmedia_20261029_the-ai-bubble-explained/$1 permanent;

            # 5. Knp? Bursa Saham Terancam Diboikot (20261031)
            rewrite ^/projects/ainimate/(?:kausalmedia/)?knp-bursa-kita-terancam-diboikot-dunia(?:/(.*))?$ /projects/ainimate/kausalmedia_20261031_knp-bursa-kita-terancam-diboikot-dunia/$1 permanent;
            rewrite ^/projects/ainimate/vid_20261031_001(?:/(.*))?$ /projects/ainimate/kausalmedia_20261031_knp-bursa-kita-terancam-diboikot-dunia/$1 permanent;

            # 6. Knp? Saham Teknologi Runtuh (20261031)
            rewrite ^/projects/ainimate/(?:kausalmedia/)?knp-saham-teknologi-runtuh(?:/(.*))?$ /projects/ainimate/kausalmedia_20261031_knp-saham-teknologi-runtuh/$1 permanent;
            rewrite ^/projects/ainimate/vid_20261031_002(?:/(.*))?$ /projects/ainimate/kausalmedia_20261031_knp-saham-teknologi-runtuh/$1 permanent;

            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /projects/ainimate/index.html =404;
            error_page 405 =200 $uri;

            sendfile        on;
            tcp_nopush      on;
            tcp_nodelay     on;
            add_header      Access-Control-Allow-Origin * always;
            add_header      Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
            add_header      Access-Control-Allow-Headers "*" always;
            add_header      Accept-Ranges bytes always;
            add_header      Cache-Control "no-cache, private" always;
        }

        # AI-nimate Audio Gate Upload API (proxied to Cuangbot daemon)
        location /projects/ainimate/api/ {
            proxy_pass http://cuangbot:8989/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 100M;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Wyckoff Quant Backtester Exact Route Redirect
        location = /projects/backtester {
            return 301 /projects/backtester/;
        }
        location = /projects/backtest {
            return 301 /projects/backtester/;
        }
        location /projects/backtest/ {
            return 301 /projects/backtester/;
        }

        # Wyckoff Quant Backtester Reverse Proxy
        location /projects/backtester/ {
            proxy_pass http://host.docker.internal:8097/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # AudioDiff Redirect /AudioDiff -> /AudioDiff/
        location = /AudioDiff {
            return 301 /AudioDiff/;
        }

        # AudioDiff WebSocket Reverse Proxy
        location /AudioDiff/ws {
            proxy_pass http://10.20.20.178:3001/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # AudioDiff REST API Reverse Proxy
        location /AudioDiff/api/ {
            proxy_pass http://10.20.20.178:3001/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Direct /api/ and /ws fallback support
        location /api/ {
            proxy_pass http://10.20.20.178:3001/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
            proxy_pass http://10.20.20.178:3001/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # AudioDiff Website Static Assets
        location /AudioDiff/ {
            alias  /usr/share/nginx/html/AudioDiff/;
            index  index.html;
            try_files $uri $uri/ /AudioDiff/index.html;
        }

        # IDXClaw Redirects
        location = /IDXClaw {
            return 301 /IDXClaw/;
        }
        location = /idxclaw {
            return 301 /IDXClaw/;
        }
        location /idxclaw/ {
            return 301 /IDXClaw/;
        }

        # IDXClaw Website Static Assets
        location /IDXClaw/ {
            alias  /usr/share/nginx/html/IDXClaw/;
            index  index.html;
            try_files $uri $uri/ /IDXClaw/index.html;
        }

        # Custom Error Pages
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
