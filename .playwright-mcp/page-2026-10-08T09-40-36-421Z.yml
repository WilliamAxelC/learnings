      - generic [ref=f3e94]:
        - heading "The Claude Behavioral Architecture" [level=2] [ref=f3e95]
        - paragraph [ref=f3e96]: How deep reasoning transforms everyday habits from a source of guilt into sustainable momentum.
      - generic [ref=f3e97]:
        - article [ref=f3e98]:
          - heading "1. Cognitive Load Calibration" [level=3] [ref=f3e102]
          - paragraph [ref=f3e103]: Traditional tools let you pile on 20 unrealistic tasks, triggering anxiety and avoidance. Our Claude engine models your daily completion velocity and cognitive fatigue, actively proposing smaller, achievable micro-wins before burnout occurs.
        - article [ref=f3e104]:
          - heading "2. Longitudinal Pattern Synthesis" [level=3] [ref=f3e109]
          - paragraph [ref=f3e110]: Instead of requiring hours of manual journaling, the AI synthesizes weeks of completion rhythms and time-stamped reflections. It identifies hidden triggers—such as how poor sleep or skipping morning hydration affects your afternoon focus.
        - article [ref=f3e111]:
          - heading "3. Sovereign Human-in-the-Loop Agency" [level=3] [ref=f3e116]
          - paragraph [ref=f3e117]: Built strictly on Constitutional AI principles. The coach never mutates your schedule autonomously or judges missed days. It acts as an empathetic strategic copilot—proposing actions that you explicitly accept, adapt, or dismiss.
    - region [ref=f3e118]:
      - generic [ref=f3e119]:
        - heading "How It Works in Practice" [level=2] [ref=f3e120]
        - paragraph [ref=f3e121]: Three straightforward steps to cultivate steady, pressure-free progress.
      - generic [ref=f3e122]:
        - article [ref=f3e123]:
          - generic [aria-hidden] [ref=f3e124]: "1"
          - heading "Pick tiny wins" [level=3] [ref=f3e125]
          - paragraph [ref=f3e126]: Choose one to three small, realistic wins each morning. Recurring habits automatically appear on your daily checklist right when scheduled.
        - article [ref=f3e127]:
          - generic [aria-hidden] [ref=f3e128]: "2"
          - heading "Check them off" [level=3] [ref=f3e129]
          - paragraph [ref=f3e130]: Single-tap checks provide clear, satisfying feedback as you finish each task. Late night? The 4:00 AM rollover ensures your evening efforts count properly.
        - article [ref=f3e131]:
          - generic [aria-hidden] [ref=f3e132]: "3"
          - heading "Let the coach nudge you" [level=3] [ref=f3e133]
          - paragraph [ref=f3e134]: When you need ideas or gentle encouragement, the AI coach offers supportive suggestions based on your history. You stay in control of what gets added.
    - region [ref=f3e135]:
      - generic [ref=f3e136]:
        - heading "Built for Real Life, Zero Gimmicks" [level=2] [ref=f3e137]
        - paragraph [ref=f3e138]: Only authentic, implemented capabilities designed for real-world daily rhythm.
      - generic [ref=f3e139]:
        - article [ref=f3e140]:
          - heading "Streak with a Free Weekly Skip" [level=3] [ref=f3e145]
          - paragraph [ref=f3e146]: Life happens and missing a day shouldn't reset weeks of dedication. One free skip per ISO week preserves your streak automatically when rest is needed.
        - article [ref=f3e147]:
          - heading "4:00 AM Day Rollover" [level=3] [ref=f3e152]
          - paragraph [ref=f3e153]: Your calendar doesn't abruptly reset at midnight. All wins count until 4:00 AM local time, accommodating night owls and evening routines.
        - article [ref=f3e154]:
          - heading "Flexible Habit Cadences" [level=3] [ref=f3e159]
          - paragraph [ref=f3e160]: Schedule habits for every day, weekdays only, or N days per week. Habit-specific streaks keep track of your consistency over time.
        - article [ref=f3e161]:
          - heading "Guardrailed AI Coach" [level=3] [ref=f3e165]
          - paragraph [ref=f3e166]: The coach only proposes wins for you to accept or edit—it never writes to your data directly. Enforces a strict monthly budget cap with instant rule-based fallback.
        - article [ref=f3e167]:
          - heading "Biometric Passkey & Password Auth" [level=3] [ref=f3e171]
          - paragraph [ref=f3e172]: Sign in effortlessly with Touch ID, Face ID, security keys, or a traditional secure password hashed with bcrypt and stored in private SQLite.
        - article [ref=f3e173]:
          - heading "Installable Progressive Web App" [level=3] [ref=f3e177]
          - paragraph [ref=f3e178]: Service-worker powered PWA that installs on your phone or desktop home screen. Loads in milliseconds with offline resilience and zero bundle bloat.
        - article [ref=f3e179]:
          - heading "Building in Public Dev Log" [level=3] [ref=f3e183]
          - paragraph [ref=f3e184]: Full transparent record of product milestones, architectural ADRs, and database iterations published regularly in our open public log.
