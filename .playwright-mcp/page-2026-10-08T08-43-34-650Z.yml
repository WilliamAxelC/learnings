            - heading "Guardrailed AI Coach" [level=3] [ref=f3e109]
            - paragraph [ref=f3e110]: The coach only proposes wins for you to accept or edit—it never writes to your data directly. Enforces a strict monthly budget cap with instant rule-based fallback.
